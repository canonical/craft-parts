name: dev
base: ubuntu@26.04
sdks:
  - name: uv
    channel: latest/stable
  - name: go
    channel: latest/stable
  - name: actionlint
    channel: latest/stable
  - name: tombi
    channel: latest/stable
  - name: prek
    channel: latest/stable
  - name: project-craft-parts
connections:
  - plug: craft-parts:venv
    slot: uv:venv
actions:
  setup: env UV_PROJECT_ENVIRONMENT=/opt/venv make setup
  test-fast: env UV_PROJECT_ENVIRONMENT=/opt/venv make test-fast
  test-slow: env UV_PROJECT_ENVIRONMENT=/opt/venv make test-slow
  test: env UV_PROJECT_ENVIRONMENT=/opt/venv make test
  test-root: sudo env PATH="$PATH" UV_PROJECT_ENVIRONMENT=/opt/venv uv run pytest
    -m requires_root -p no:cacheprovider --cache-dir=/tmp/pytest-root
  lint: env UV_PROJECT_ENVIRONMENT=/opt/venv make lint
  lint-code: env UV_PROJECT_ENVIRONMENT=/opt/venv make lint-code
  lint-docs: env UV_PROJECT_ENVIRONMENT=/opt/venv make lint-docs
  format: env UV_PROJECT_ENVIRONMENT=/opt/venv make format

name: Release
on:
  push:
    tags:
      # These tags should be protected, remember to enable the rule:
      # https://github.com/canonical/starbase/settings/tag_protection
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - .github/workflows/release-publish.yaml

jobs:
  # On tag pushes, fail fast if the hand-maintained Cargo.toml version does
  # not match the tag, before any wheels are built or published.
  check-version:
    if: github.event_name == 'push'
    runs-on: [self-hosted, amd64, medium, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert tag matches Cargo.toml version
        run: python3 tools/check_version.py

  # Build the full wheel matrix (all arches + abi3) and the sdist via the
  # reusable wheels workflow. This runs on every push to this file (for PRs) and
  # on release tags; only the tag path is published below.
  pypi-artifacts:
    needs: ["check-version"]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    uses: ./.github/workflows/wheels.yaml
  # NOTE: This PyPI publishing job is often unnecessary for most applications
  # that use starbase. Please ensure this job is excluded from merges/PRs
  # originating from starbase unless explicitly required for a specific app.
  pypi:
    needs: ["pypi-artifacts"]
    runs-on: [self-hosted, amd64, medium, linux]
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Get packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-artifacts
          path: dist/
      - name: Publish to pypi
        # Only actually push to pypi when we're on a tag.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        # Note: this action uses PyPI's support for Trusted Publishers
        # It needs a configuration on the PyPI project - see:
        # https://docs.pypi.org/trusted-publishers/adding-a-publisher/#github-actions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
  github-release:
    needs: ["pypi-artifacts"]
    runs-on: [self-hosted, medium, linux]
    permissions:
      contents: write
    steps:
      - name: Get pypi artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-artifacts
      - name: Release
        # Only actually publish the Github release when we're on a tag.
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes -- *.whl *.tar.gz
